<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>



<body>
   
     
     <div class="input-group">
     
     <input type="text" placeholder="Create some task...">

     <button> + </button>

     <p class="error-input"> A task must be provided.</p>
    
     </div>



     <ul class="task-list">

     <li class="task">
     <button class="delete"> X </button>
     <span class="task-text"> Welcome to the todo app!</span>
     <button class="complete"> ✓ </button>
</li>

<li class="task completed">
     <button class="delete"> X </button>
     <span class="task-text"> Esto es una lista de tareas</span>
     <button class="complete"> ✓ </button>
</li>


<li class="task">
     <button class="delete"> X </button>
     <span class="task-text"> Tiene contadores</span>
     <button class="complete"> ✓ </button>
</li>


</ul>

<footer class="counters">

    <span class="counter total"> Total: 3</span>
    <span class="counter completed"> Completed: 0</span>
    <span class="counter incompleted">  Incompleted: 3</span>



</footer>


</body>
</html>
